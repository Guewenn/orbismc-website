<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="diamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="facetTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="facetMidL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="facetMidC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="facetMidR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="diamShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="56" fill="url(#diamGlow)"/>
  <g filter="url(#diamShadow)">
    <!-- Table supérieure -->
    <polygon points="40,28 88,28 104,50 24,50" fill="url(#facetTop)"/>
    <polygon points="40,28 64,50 24,50" fill="#bae6fd"/>
    <polygon points="64,28 88,28 64,50" fill="#e0f2fe"/>
    <polygon points="40,28 64,28 64,50" fill="#ffffff"/>
    <polygon points="88,28 104,50 64,50" fill="#7dd3fc"/>
    <!-- Pavillon inférieur -->
    <polygon points="24,50 64,106 46,50" fill="url(#facetMidL)"/>
    <polygon points="46,50 64,106 64,50" fill="url(#facetMidC)"/>
    <polygon points="64,50 64,106 82,50" fill="#38bdf8"/>
    <polygon points="82,50 64,106 104,50" fill="url(#facetMidR)"/>
    <!-- Étoile d'éclat -->
    <circle cx="48" cy="38" r="4" fill="white"/>
    <line x1="48" y1="30" x2="48" y2="46" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="38" x2="56" y2="38" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
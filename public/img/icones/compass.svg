<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="brassRim" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="55%" stop-color="#e09812"/>
      <stop offset="100%" stop-color="#8a5403"/>
    </radialGradient>
    <radialGradient id="compassBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0f3a"/>
      <stop offset="100%" stop-color="#180724"/>
    </radialGradient>
    <linearGradient id="needleNorth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4f7a"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="needleSouth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="compassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2a0f3a" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#compassShadow)">
    <circle cx="64" cy="64" r="54" fill="url(#brassRim)"/>
    <circle cx="64" cy="64" r="46" fill="#5a3300"/>
    <circle cx="64" cy="64" r="43" fill="url(#compassBg)"/>
    <!-- Rose des vents discrète -->
    <path d="M64 26 L67 59 L64 64 L61 59 Z" fill="#ffd56b" opacity="0.3"/>
    <path d="M64 102 L67 69 L64 64 L61 69 Z" fill="#ffd56b" opacity="0.3"/>
    <path d="M26 64 L59 61 L64 64 L59 67 Z" fill="#ffd56b" opacity="0.3"/>
    <path d="M102 64 L69 61 L64 64 L69 67 Z" fill="#ffd56b" opacity="0.3"/>
    <!-- Aiguille Nord -->
    <polygon points="64,28 72,64 64,61" fill="url(#needleNorth)"/>
    <polygon points="64,28 56,64 64,61" fill="#ff7597"/>
    <!-- Aiguille Sud -->
    <polygon points="64,100 72,64 64,67" fill="url(#needleSouth)"/>
    <polygon points="64,100 56,64 64,67" fill="#e2e8f0"/>
    <!-- Pivot central -->
    <circle cx="64" cy="64" r="6" fill="#ffd56b"/>
    <circle cx="64" cy="64" r="3" fill="#8a5403"/>

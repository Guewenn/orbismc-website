<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="clockRim" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="50%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#b26b00"/>
    </radialGradient>
    <radialGradient id="clockFace" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f0ff"/>
      <stop offset="100%" stop-color="#e0d6fc"/>
    </radialGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#b26b00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#glowGold)">
    <!-- Bouton supérieur chrono -->
    <rect x="56" y="8" width="16" height="12" rx="4" fill="url(#clockRim)"/>
    <circle cx="64" cy="68" r="50" fill="url(#clockRim)"/>
    <circle cx="64" cy="68" r="43" fill="#8f5200"/>
    <circle cx="64" cy="68" r="40" fill="url(#clockFace)"/>
    <!-- Repères heures -->
    <circle cx="64" cy="35" r="3" fill="#5b2fd1"/>
    <circle cx="97" cy="68" r="3" fill="#5b2fd1"/>
    <circle cx="64" cy="101" r="3" fill="#5b2fd1"/>
    <circle cx="31" cy="68" r="3" fill="#5b2fd1"/>
    <!-- Aiguilles -->
    <line x1="64" y1="68" x2="64" y2="44" stroke="#2a0f3a" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="64" y1="68" x2="84" y2="68" stroke="#ff4fa0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="64" cy="68" r="5.5" fill="#2a0f3a"/>
    <circle cx="64" cy="68" r="2.5" fill="#ffc53d"/>
    <!-- Reflet verre -->
    <path d="M40 44 Q 64 36 88 44 A 40 40 0 0 0 40 44 Z" fill="white" opacity="0.45"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="shieldPlate" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <linearGradient id="shieldGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="50%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#c67100"/>
    </linearGradient>
    <filter id="shldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#shldShadow)">
    <!-- Contour doré -->
    <path d="M22 22 L106 22 C 106 60, 94 92, 64 112 C 34 92, 22 60, 22 22 Z" fill="url(#shieldGold)"/>
    <!-- Plaque intérieure acier -->
    <path d="M28 28 L100 28 C 100 62, 90 88, 64 104 C 38 88, 28 62, 28 28 Z" fill="url(#shieldPlate)"/>
    <!-- Croix héraldique or -->
    <rect x="58" y="28" width="12" height="74" fill="url(#shieldGold)"/>
    <rect x="34" y="48" width="60" height="12" rx="2" fill="url(#shieldGold)"/>
    <!-- Émeraude centrale -->
    <polygon points="64,44 74,54 64,64 54,54" fill="#10b981"/>
    <polygon points="64,48 70,54 64,60 58,54" fill="#34d399"/>
    <!-- Rivets de coin -->
    <circle cx="34" cy="34" r="3" fill="#cbd5e1"/>
    <circle cx="94" cy="34" r="3" fill="#cbd5e1"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bookCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b2848"/>
      <stop offset="50%" stop-color="#641630"/>
      <stop offset="100%" stop-color="#420b1e"/>
    </linearGradient>
    <linearGradient id="goldFiligree" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="50%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#c67100"/>
    </linearGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2a0f3a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#bookShadow)">
    <!-- Pages sous le livre -->
    <path d="M26 30 C 26 25, 45 23, 64 27 C 83 23, 102 25, 102 30 L 102 96 C 83 91, 64 94, 64 99 C 64 94, 45 91, 26 96 Z" fill="#f8f4eb"/>
    <path d="M24 32 C 24 27, 44 25, 64 29 C 84 25, 104 27, 104 32 L 104 98 C 84 93, 64 96, 64 101 C 64 96, 44 93, 24 98 Z" fill="#eee6d5"/>
    <!-- Couverture extérieure -->
    <path d="M22 34 C 22 28, 43 26, 64 30 C 85 26, 106 28, 106 34 L 106 102 C 85 96, 64 100, 64 105 C 64 100, 43 96, 22 102 Z" fill="url(#bookCover)"/>
    <!-- Dos du livre relié -->
    <path d="M61 29 C 63 28, 65 28, 67 29 L 67 105 C 65 104, 63 104, 61 105 Z" fill="url(#goldFiligree)"/>
    <!-- Ornements de coins -->
    <path d="M25 36 L36 36 L25 47 Z" fill="url(#goldFiligree)"/>
    <path d="M103 36 L92 36 L103 47 Z" fill="url(#goldFiligree)"/>
    <path d="M25 98 L36 98 L25 87 Z" fill="url(#goldFiligree)"/>
    <path d="M103 98 L92 98 L103 87 Z" fill="url(#goldFiligree)"/>
    <!-- Sceau central magique -->
    <circle cx="64" cy="64" r="14" fill="url(#goldFiligree)"/>
    <circle cx="64" cy="64" r="10" fill="#7c4dff"/>
    <polygon points="64,57 67,62 72,64 67,66 64,71 61,66 56,64 61,62" fill="#ffc53d"/>
    <!-- Ruban signet -->
    <path d="M64 30 L64 114 L58 108 L52 114 L52 30 Z" fill="#ff4fa0"/>
  </g>
</svg>